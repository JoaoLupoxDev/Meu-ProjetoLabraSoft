<!DOCTYPE html>
<html lang="pt-br">
<head>
        <meta charset="UTF-8">
        <title>Fundação - Cadastro de Bolsista</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">Cadastro de Bolsista</h2>
            </div>
            <div class="card-body">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Nome Completo:</label>
                        <input type="text" class="form-control" placeholder="Digite o nome">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">CPF:</label>
                        <input type="text" class="form-control" placeholder="Digite o CPF">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Matricula:</label>
                        <input type="text" class="form-control" placeholder="Digite o numero da matricula">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Data de Nascimento:</label>
                        <input type="date" class="form-control" placeholder="Digite o a sua data de nascimento">
                    </div>
                    <label>Selecione o seu genero:</label>
                    <select>
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Não-Binário">Não-binário</option>
                        <option value="Prefiro não dizer">Prefiro não dizer</option>
                    </select>
                    <hr />
                    <button type="button" class="btn btn-success">Salvar (Semana 1: Visual)</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
